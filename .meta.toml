# Generated with zope.meta (https://zopemeta.readthedocs.io/) from:
# https://github.com/zopefoundation/meta/tree/master/src/zope/meta/pure-python
[meta]
template = "pure-python"
commit-id = "7cab96bb"

[python]
with-windows = true
with-pypy = true
with-future-python = true
with-docs = true
with-sphinx-doctests = false
with-macos = false
with-free-threaded-python = false

[tox]
use-flake8 = true

[coverage]
fail-under = 98

[manifest]
additional-rules = [
    "include *.yaml",
    "include *.yml",
    "recursive-include docs *.bat",
    "recursive-include docs *.conf",
    "recursive-include docs *.dtd",
    "recursive-include src *.conf",
    "recursive-include src *.txt",
    "recursive-include src *.xml",
    "recursive-include src *.zip",
    ]
